site_name: apkfile
site_description: Read, inspect, and install Android app packages
site_url: https://apkfile.readthedocs.io
repo_name: david-lev/apkfile
repo_url: https://github.com/david-lev/apkfile
edit_uri: edit/main/docs/
copyright: Copyright &copy; David Lev

docs_dir: .
site_dir: ../site
exclude_docs: mkdocs.yml

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - API Reference:
      - ApkFile: reference/apk.md
      - Bundles (Apkm/Xapk/Apks/Apkv): reference/bundle.md
      - Signing: reference/signing.md
      - Security: reference/security.md
      - Size & DEX: reference/size.md
      - Resources & Icons: reference/resources.md
      - Diffing: reference/diff.md
      - Installing/Uninstalling (adb): reference/install.md
      - Enums (Abi, FormFactor, ...): reference/enums.md
      - Exceptions: reference/exceptions.md

theme:
  name: material
  logo: assets/logo-light.svg
  favicon: assets/logo-light.svg
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.top
    - content.code.copy
    - content.action.edit
    - search.suggest

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - toc:
      permalink: true

plugins:
  - search
  - autorefs
  - mkdocstrings:
      handlers:
        python:
          paths: [..]
          options:
            docstring_style: google
            show_root_heading: true
            show_root_full_path: false
            show_source: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            merge_init_into_class: true
            docstring_section_style: table
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            members_order: source
            heading_level: 2

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/david-lev/apkfile
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/apkfile/
